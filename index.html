<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d4f4c" />

    <title>Ajani Healthcare — Healthcare workforce, digital health and operations</title>
    <meta
      name="description"
      content="Ajani Healthcare is a UK healthcare-focused company working across healthcare workforce support, digital health and operations, and UK healthcare product readiness."
    />

    <!--
      The `?v=` is a cache buster, and it earns its keep.

      Browsers cache a favicon per origin and hold it across ordinary reloads,
      so replacing the file on disk is not enough: a tab that already knew this
      origin kept showing the retired gold-A mark while the page itself
      rendered the current one. Changing the URL is what makes it re-fetch.
      Bump the number whenever the identity changes.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="alternate icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ajani Healthcare" />
    <meta
      property="og:title"
      content="Ajani Healthcare — Healthcare workforce, digital health and operations"
    />
    <meta
      property="og:description"
      content="A UK healthcare-focused company working across healthcare workforce support, digital health and operations, and UK healthcare product readiness."
    />

    <!--
      The sharing image is the brand mark on its plate colour, generated by
      scripts/generate-icons.mjs from the same coordinates as the favicon, so
      the card and the tab cannot show different artwork. It carries no
      wordmark and no address.

      The path is root-relative rather than absolute because the site has no
      canonical origin declared anywhere in this repository; every major
      crawler resolves it against the page being shared. Once a canonical
      domain is settled this should become an absolute URL.
    -->
    <meta property="og:image" content="/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Ajani Healthcare mark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
